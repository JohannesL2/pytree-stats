[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pytree-stats"
version = "1.0.0"
description = "Analyze files and folders fast"
readme = "docs/README.md"
requires-python = ">=3.8"

dependencies = [
    "rich",
    "pyperclip"
]

[project.scripts]
pytree = "main:main"
pytree-stats = "main:main"

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.setuptools]
packages = ["app"]
py-modules = ["main"]

[tool.pytest.ini_options]
pythonpath = ["."]